name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ENV: production

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Wails' default Linux backend is cgo + GTK4/WebKitGTK 6.0. gcc is
      # preinstalled on the runner; the AppImage tooling runs with
      # --appimage-extract-and-run, so FUSE is not needed.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.16.1"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Package Linux
        run: wails3 package GOOS=linux VERSION=${{ github.ref_name }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find bin -maxdepth 1 -type f -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.16.1"

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      # Wails v3 on Windows is pure Go and the app uses the pure-Go modernc
      # SQLite driver, so no C toolchain (MSYS2/MinGW) is needed.
      - name: Package Windows
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: wails3 package GOOS=windows VERSION=${{ github.ref_name }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem bin -File | Copy-Item -Destination dist
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.16.1"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Package macOS
        run: wails3 package GOOS=darwin VERSION=${{ github.ref_name }}

      - name: Create DMG
        run: wails3 task darwin:package:dmg

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find bin -maxdepth 1 -type f -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos

    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Display release files
        run: ls -lh dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
