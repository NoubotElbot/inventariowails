
name: "inventariowails"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Aplicación de gestión de inventario"
vendor: "InventarioWails"
homepage: "https://github.com/TU_USUARIO/inventariowails"
license: "MIT"
release: "1"

contents:
  - src: "./bin/inventariowails"
    dst: "/usr/local/bin/inventariowails"
    file_info:
      mode: 0755

  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/inventariowails.png"

  - src: "./build/linux/inventariowails.desktop"
    dst: "/usr/share/applications/inventariowails.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
