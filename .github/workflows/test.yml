name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Go)
    runs-on: ubuntu-latest

    env:
      # Wails' CGO-free Linux backend: compiles without GTK/WebKit headers, so
      # no system packages are needed. Tests never open a window; release
      # builds still use the default cgo backend.
      GOFLAGS: -tags=purego

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Keep this aligned with the go directive in go.mod.
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./internal/...

      - name: Run Go tests
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out ./internal/...
